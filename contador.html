<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Contador</title>
<!-- O OBS mostra esta página (720x1280, fundo transparente) por cima do vídeo da live do TikTok.
     Mesmo desenho do contador que vai no vídeo da Shopee (contador.py): à esquerda, logo abaixo do
     cartão do produto. Vermelho no último minuto; ao zerar, some. -->
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  .cont { position: absolute; left: 11vw; top: 28vh; width: 29vw; height: 7.6vh; box-sizing: border-box;
          border-radius: 1.52vh; background: #fff; box-shadow: 0 0.25vh 0.9vh rgba(0,0,0,.22);
          font-family: "Segoe UI", sans-serif; font-weight: 600; text-align: center; display: none; }
  .cont.ver { display: block; }
  .txt { position: absolute; left: 0; right: 0; top: 0.78vh; font-size: 1.786vh; line-height: 1.33; color: #3d3d3a; }
  .tempo { position: absolute; left: 0; right: 0; top: 3.2vh; display: flex; align-items: center; justify-content: center;
           gap: 0.7vh; font-size: 3.116vh; line-height: 1.33; color: #2c2c2a; font-variant-numeric: tabular-nums; }
  .tempo svg { width: 1.95vh; height: 1.95vh; flex: none; color: #ee4d2d; }
  .cont.urgente { background: #e02424; }
  .cont.urgente .txt, .cont.urgente .tempo, .cont.urgente .tempo svg { color: #fff; }
  /* card "SIGA O PERFIL" (mesma imagem que vai no vídeo da Shopee); liga e desliga pelo painel */
  .card { position: absolute; left: 11vw; top: 37.5vh; width: 42vw; height: auto; display: none; }
  .card.ver { display: block; }
</style>
</head>
<body>
<img class="card" id="card" src="/card_siga.png" alt="">
<div class="cont" id="cont">
  <div class="txt" id="txt">Oferta termina em</div>
  <div class="tempo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12h4.2"/></svg><span id="tempo">00:00</span></div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const lado = params.get("lado") || "st";
  const cont = document.getElementById("cont");
  const card = document.getElementById("card");
  function mostrar(e) {
    const ver = e.fase === "normal" || e.fase === "urgente";
    cont.className = "cont" + (ver ? " ver " + e.fase : "");
    if (ver) document.getElementById("tempo").textContent = e.tempo;
    if (e.texto) document.getElementById("txt").textContent = e.texto;
    card.className = "card" + (e.card ? " ver" : "");
    if (e.card_pos) {
      card.style.left = (e.card_pos.x * 100) + "vw";
      card.style.top = (e.card_pos.y * 100) + "vh";
      card.style.width = (e.card_pos.larg * 100) + "vw";
    }
  }
  async function atualizar() {
    try {
      const r = await (await fetch("/api/contador", { cache: "no-store" })).json();
      mostrar(r[lado] || { fase: "off" });
    } catch (_) {
      cont.className = "cont";          // painel fechado: não mostra nada
      card.className = "card";
    }
  }
  if (params.get("demo")) {            // só para conferir o desenho: ?demo=normal, ?demo=urgente ou ?demo=card
    const d = params.get("demo");
    mostrar({ fase: d === "card" ? "off" : d, tempo: d === "urgente" ? "00:04" : "01:08", card: d === "card" });
  } else {
    atualizar();
    setInterval(atualizar, 250);
  }
</script>
</body>
</html>
